---
- hosts: desktop
  become: true
  gather_facts: true
  # zypper waits up to 5 min for the zypp lock (e.g. held by packagekitd / GNOME Software) instead of failing
  environment:
    ZYPP_LOCK_TIMEOUT: "300"
  roles:
    - role: ansible-role-repo
      tags: [repo]
    # system-wide settings: /etc/vimrc without viminfo (before anything is edited with vim)
    - role: ansible-role-system
      tags: [system]
    - role: ansible-role-hardware
      tags: [hardware]
    - role: ansible-role-disk
      tags: [disk]
    # before ansible-role-user: the packages create group libvirt
    - role: ansible-role-virt
      tags: [virt]
    # after virt (zone libvirt exists): the only firewalld writer - default zone, service lists of the zones
    # (incl. syncthing, nfs in libvirt), NetworkManager profiles
    - role: ansible-role-network
      tags: [network]
    # host keys from the vault, /etc/ssh/ssh_known_hosts from the inventory, temporary VMs in ~/.ssh/known_hosts_vms
    - role: ansible-role-ssh
      tags: [ssh]
    - role: ansible-role-user
      tags: [user]
    # after ansible-role-user (homes exist); firewall rule nfs in zone libvirt: ansible-role-network
    - role: ansible-role-nfsserver
      tags: [nfsserver]
    - role: ansible-role-syncthing
      tags: [syncthing]
    - role: ansible-role-citrix
      tags: [citrix]
    - role: ansible-role-software
      tags: [software]
    - role: ansible-role-ksuite
      tags: [ksuite]
    # after ansible-role-software (GNOME and dconf installed)
    - role: ansible-role-gnome
      tags: [gnome]
    - role: ansible-role-btrbk
      tags: [btrbk]
