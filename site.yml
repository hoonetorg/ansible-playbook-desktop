---
- hosts: desktop
  become: true
  gather_facts: true
  # zypper waits up to 5 min for the zypp lock (e.g. held by packagekitd / GNOME Software) instead of failing
  environment:
    ZYPP_LOCK_TIMEOUT: "300"
  roles:
    - role: ansible-role-repo
    - role: ansible-role-hardware
    - role: ansible-role-disk
    # before ansible-role-user: the packages create group libvirt
    - role: ansible-role-virt
    - role: ansible-role-user
    # after ansible-role-user (homes exist) and ansible-role-virt (firewalld zone libvirt exists)
    - role: ansible-role-nfsserver
    - role: ansible-role-syncthing
    - role: ansible-role-citrix
    - role: ansible-role-software
    - role: ansible-role-btrbk
